<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#164d42">
    <meta name="description" content="Encontrá objetos para todos los días en QRMarket MP. Explorá el catálogo y descubrí tu próximo favorito.">
    <title>QRMarket MP · Encontrá tu próximo favorito</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a href="#main" class="skip-link">Saltar al contenido</a>
    <div class="announcement"><div class="container"><span>Objetos que hacen tu día.</span><span>Una selección para vos <span aria-hidden="true">↗</span></span></div></div>
    <header class="site-header">
      <div class="container header-content">
        <a class="brand" href="/" data-link aria-label="QRMarket MP, inicio">
          <img src="/assets/favicon.svg" alt="" width="38" height="38">
          <span>qrmarket<span class="brand-mp">mp</span></span>
        </a>
        <form id="search-form" class="search" role="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="search" type="search" name="buscar" placeholder="¿Qué estás buscando?" aria-label="Buscar productos" autocomplete="off">
          <button type="submit" class="search-submit" aria-label="Buscar">↵</button>
        </form>
        <button class="selection-button" id="open-selection" aria-haspopup="dialog">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
          <span>Tu selección</span><span class="selection-count" id="selection-count">0</span>
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1"><div class="container loading" role="status">Preparando tus próximos favoritos…</div></main>
    <footer class="site-footer"><div class="container footer-content"><a class="footer-brand" href="/" data-link>qrmarket<span>mp</span></a><p>Pequeños hallazgos. Grandes momentos.</p><span>Catálogo de demostración · ARS</span></div></footer>
    <dialog id="selection-dialog" aria-labelledby="selection-title">
      <div class="dialog-header"><div><span class="eyebrow">TUS FAVORITOS DEL DÍA</span><h2 id="selection-title">Tu selección</h2></div><button class="icon-button" id="close-selection" aria-label="Cerrar selección">×</button></div>
      <div id="selection-content"></div>
      <button class="button button-primary dialog-continue" id="continue-shopping">Seguir explorando <span aria-hidden="true">↗</span></button>
    </dialog>
    <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
    <noscript><div class="container empty-state">Activá JavaScript en tu navegador para ver el catálogo.</div></noscript>
  </body>
</html>
